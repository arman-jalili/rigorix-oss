[package]
name = "rigorix-cli"
version = "1.14.3"
edition = "2024"
description = "Template-driven DAG execution CLI — thin wrapper around rigorix-engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arman-jalili/rigorix-oss"
documentation = "https://docs.rs/rigorix-cli"

[lib]
name = "rigorix"

[features]
default = []
# #1355: the M2 measurement surface — pinned clock and id flags for one precondition
# refusal, so the CLI and the crate can be compared byte for byte. Non-default: a
# default build's commands, flags and behaviour are exactly 1.12.1's.
pinned-inputs = []

[dependencies]
rigorix-engine = { path = "../engine", version = "1.14.3" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
hex = "0.4"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
clap = { version = "4", features = ["derive", "env"] }
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
uuid.workspace = true
rand.workspace = true
ratatui = "0.30"
crossterm = "0.28"
futures = "0.3"
dirs = "6"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
