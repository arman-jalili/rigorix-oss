[package]
name = "rigorix-gate-wasm"
version = "1.14.3"
edition = "2024"
description = "Portable Rigorix gate seam — deterministic WebAssembly slice that evaluates a proposed action and exports a verifiable record"
license = "MIT OR Apache-2.0"
authors = ["Arman Wolkensteiner-Jalili and Rigorix contributors"]
repository = "https://github.com/arman-jalili/rigorix-oss"
documentation = "https://docs.rs/rigorix-gate-wasm"
rust-version = "1.85"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# #1401: the shipped artifact decides. The engine composition, the four host ports and the
# envelope were merged in C.3–C.6; a crate whose default configuration cannot evaluate is a
# contract with a gate behind a flag, not a gate. `--no-default-features` keeps the
# contract-only build, which still refuses at `open_session` with `gate_unavailable` — that is
# what a build that cannot evaluate *is*, and its test is unchanged.
default = ["engine", "bindgen"]
# The in-repo seam: binds rigorix-engine's gate behind its additive, non-default
# feature. Phase C.3 (#1383): the composition, the ports and the envelope all live
# in the engine; this crate supplies the ports and calls one function.
engine = [
    "dep:rigorix-engine",
    "dep:uuid",
    "dep:async-trait",
    "dep:chrono",
]
# The JS export layer (#1349), and the reason it is a feature: a second consumer links this
# crate's *operations* and must not link its *binding*. `#[wasm_bindgen]` exports are
# `no_mangle`, so the linker keeps them and their `__wbindgen_*` references with them — which is
# why the WASI artifact (#1465) turns this off. It still carries six `std` prologue imports on
# `wasm32-wasip1` (recorded in `wasi/ci/imports.txt`), none of which a decision reads.
bindgen = []
# Test-only: conformance vector replay (ADR-009). Never part of the bundle.
conformance = []
# Off by default: a release bundle keeps no diagnostic channel (ADR-003, criterion 17).
diagnostics = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# The engine hashes canonical forms with sha2; matching it is a byte-identity
# requirement, not a preference (ADR-010).
sha2 = "0.11"
# Phase C.3: the engine's portable slice. Optional so the default (contract-only)
# build still proves the crate compiles without it.
#
# #1401: declared **twice on purpose**, and the second declaration is the load-bearing one.
# `portable` is a *subtractive* feature — it `cfg(not(...))`-s native modules out — so it is
# the one kind of feature Cargo's unification cannot be allowed to spread. With a single
# `features = ["portable"]` here, any workspace build that includes this crate and `mcp` or
# `actions` unifies `portable` for the whole graph and removes `identity::infrastructure::
# JwksVerifier`, `orchestrator`, `plan_validation` and ~80 other items from under them. That
# is what `cargo clippy --workspace --all-targets` reported the moment `default = ["engine", "bindgen"]`
# landed — a workspace clippy failure caused by a wasm manifest line.
#
# Host builds therefore link the engine *whole* (tests, clippy, benches: no slice needed),
# and the wasm32 target links the slice. Unification is per-target, so the slice cannot leak
# into a native build and the native modules cannot be needed by a wasm build.
async-trait = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
# The execution id the gate pins (ADR-014 §2) is a `Uuid` in the engine's API; the crate
# passes it through rather than re-modelling it. Optional and `js`-featured: `uuid` refuses
# to build for wasm32 without a randomness source, and the default (contract-only) build
# must not acquire one it never uses.
uuid = { workspace = true, features = ["js"], optional = true }

# The wasm32 target gets the slice, and only the wasm32 target (#1401). Feature unification is
# per-target, so a wasm32-only `portable` cannot reach a native build of `mcp`/`actions` that
# shares the graph — which is what happened when the feature list carried
# `rigorix-engine/portable` unconditionally: `cargo clippy --workspace --all-targets` lost
# `identity::infrastructure::JwksVerifier`, `orchestrator` and `plan_validation` from under
# `mcp` and `actions`.
#
# Cargo will not accept this package in `[dependencies]` *and* here ("duplicate key"), so both
# targets are declared — the same shape `engine/Cargo.toml` uses for `tokio`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rigorix-engine = { path = "../engine", version = "1.14.3", optional = true }

[lints]
# Inherited, not re-listed. Declaring a local `[lints.rust]` block without
# `workspace = true` opts out of *every* workspace lint, silently — this crate was the only
# member doing that, so `clippy::disallowed_types` (clippy.toml, #1083: process spawning is a
# privileged sink) never applied here even though ADR-011 said it did.
# `unsafe_code = "forbid"` (ADR-012 tier 2) moved to the crate root in src/lib.rs, because
# cargo does not allow mixing `workspace = true` with local overrides.
workspace = true

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

# The JS binding is for **non-JS-less wasm32** only: `target_os = "unknown"` is
# `wasm32-unknown-unknown`, the browser/Node target `wasm-bindgen` emits JS glue for. The
# WASI artifact (#1465) is the same crate on `wasm32-wasip1`, where a `__wbindgen_*` import
# would be a host dependency the whole boundary exists to avoid — so the attribute layer is
# gated on the target, not on the architecture. `wasm32-wasip1` still takes the slice below.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2.130"

# The slice, wasm32 only (#1401) — the counterpart of the `not(wasm32)` declaration above.
# Both wasm targets take it: `wasm32-unknown-unknown` for the browser artifact and
# `wasm32-wasip1` for the WASI one (#1465). The binding is what differs, not the slice.
[target.'cfg(target_arch = "wasm32")'.dependencies]
rigorix-engine = { path = "../engine", version = "1.14.3", features = ["portable"], optional = true }

[[example]]
name = "determinism_probe"
# The probe replays a vector, so it needs the harness the `conformance` feature compiles in
# (#1385). Without this the example fails to build in a default-feature test run.
required-features = ["conformance"]
