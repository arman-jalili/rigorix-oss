[package]
name = "rigorix-server"
version = "0.1.0"
edition = "2024"
description = "OSS reference execution host — axum JSON-RPC 2.0 + SSE over the frozen rigorix.* catalog"
license = "MIT OR Apache-2.0"
authors = ["Arman Wolkensteiner-Jalili and Rigorix contributors"]
repository = "https://github.com/arman-jalili/rigorix-oss"
documentation = "https://docs.rs/rigorix-server"
publish = false

[[bin]]
name = "rigorix-server"
path = "src/main.rs"

[dependencies]
rigorix-engine = { path = "../engine", version = "1.11.0" }
rigorix-mcp = { path = "../mcp", version = "1.11.0" }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
# MCP Streamable HTTP session ids (#915) — unguessable ids, workspace-pinned.
uuid = { workspace = true }

# First HTTP dependency since GAP-A-10. Keep the transport thin; the catalog is
# the contract (see docs/sdk-server-strategy-freeze-2026-09-06.md).
axum = { version = "0.8", features = ["macros"] }
# SSE live stream + bounded broadcast backpressure
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"

[dev-dependencies]
tempfile = { workspace = true }
chrono = { workspace = true }
# Drive the axum router in-process for the MCP Streamable HTTP integration test.
tower = { version = "0.5", features = ["util"] }
# Real HTTP/SSE client for the end-to-end transport test (#1209).
reqwest = { workspace = true }
# OSS-CATALOG-SUBSET-VERIFIER (#907): the SHARED closed-namespace guard.
# Published crates.io dependency (NOT path/git) so a fresh public clone builds.
rigorix-verifier = "0.8.1"

[lints]
workspace = true
