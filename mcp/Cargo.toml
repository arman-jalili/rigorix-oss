[package]
name = "rigorix-mcp"
version = "1.3.0"
edition = "2024"
description = "MCP Gateway server for Rigorix — protocol types, transports, session management, tool routing, resource/prompt providers"
license = "MIT OR Apache-2.0"
authors = ["Arman Wolkensteiner-Jalili and Rigorix contributors"]
repository = "https://github.com/arman-jalili/rigorix-oss"
documentation = "https://docs.rs/rigorix-mcp"

[dependencies]
# Shared workspace dependencies
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
toml = { workspace = true }

# HMAC-SHA256 signing of audit envelopes (same canonical-field scheme as engine)
hmac = { workspace = true }
sha2 = { workspace = true }

# rigorix-engine for execution orchestration
rigorix-engine = { path = "../engine", version = "1.3.0" }

# HTTP client for enterprise proxy
reqwest = { workspace = true }

# OS keychain custody for auth refresh tokens (macOS Keychain, Windows
# Credential Manager, Linux Secret Service)
keyring = "4"

# Axum for SSE transport
axum = { version = "0.8", features = ["macros"], optional = true }

[features]
default = ["sse"]
sse = ["dep:axum"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dev-dependencies]
# Non-blocking pipe polling in e2e tests (GAP-A-25)
libc = "0.2"
