[package]
name = "rigorix-engine"
version = "1.13.0"
edition = "2024"
description = "Template-driven DAG execution engine with bounded autonomy"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arman-jalili/rigorix-oss"
documentation = "https://docs.rs/rigorix-engine"

[features]
live-tests = []
# Contract-sync conformance (F-20260907-01/02): validates real engine output
# against rigorix-sdk schemas (schemas/envelope.json|policy.json|claims.json).
# CI conformance job checks out rigorix-sdk (RIGORIX_SDK_TOKEN) and sets
# RIGORIX_SDK_SCHEMAS; runs: cargo test -p rigorix-engine --features conformance
conformance = []
# The gate slice a browser can compile (#1351 M1). `portable` compiles out every
# engine module that needs an OS, a socket, a C lexer, a crypto provider or a
# metrics sink; the native-only crates are absent from the wasm32 graph by
# target, so the tree cannot smuggle one back in. Native builds ignore it, and
# a native `--features portable` build is how the slice's own tests run fast.
portable = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
async-trait.workspace = true
uuid.workspace = true
chrono.workspace = true
sha2 = { workspace = true }
hmac = { workspace = true }
hex = "0.4"
base64 = "0.22"
tracing.workspace = true
tracing-subscriber.workspace = true
regex.workspace = true
indexmap = { version = "2", features = ["serde"] }

# ── Native-only graph (#1351) ────────────────────────────────────────────────
# Everything below needs a real OS, socket, C toolchain, crypto provider or
# metrics sink, so it is not fetched at all when the target is wasm32. This is
# the dependency half of `--features portable`; the source half is the cfg gates
# in `src/`. Keeping the exclusion here (rather than in a feature) is what makes
# `cargo tree --target wasm32` provably free of them: an absent dependency
# cannot be re-enabled by another crate in the graph.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true
ring = "0.17"
# ADR-016 Phase C: verify the anchor's Ed25519 signature over a history slice
# (asymmetric — the host holds only the public key).
ed25519-dalek = "2"
reqwest.workspace = true
# POSIX euid + supplementary-group checks for the precondition trust boundary
# (`require_immutable_check`). Unix-only use.
libc = "0.2"
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.21"
tracing-appender = "0.2"
prometheus = "0.14.0"
tokio-util.workspace = true
rand = "0.10.1"

# The browser has no mio, so tokio is narrowed to the parts that are
# target-independent. Declared explicitly (not `workspace = true`) because the
# workspace's `["full"]` cannot be un-inherited.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# `sync` only. The rest of tokio is a *runtime*, and a single-threaded module has none:
# `rt` spawns, `time` drives a timer, `macros` expands to both. The four modules that keep
# tokio on this target (event_system, audit, configuration, dag_engine) use `sync`
# primitives and nothing else; the features that remain here are the ones a wasm build would
# need only if a module that is excluded from the slice came back in.
#
# This is the line #1400 is about: the dependency that reached wasm32 was never the
# `cfg(not(wasm32))` one at the top of this file, and narrowing it here is what lets
# `wasm/ci/check-bundle-independence.sh` assert "no runtime on the gate path" rather than
# "no crate named tokio".
tokio = { version = "1", default-features = false, features = ["sync"] }
# uuid refuses to build for wasm32 without a randomness backend; `js` is the
# browser's (getrandom -> wasm-bindgen -> crypto.getRandomValues). The pin is
# only the *source*: `portable` code paths take ids from a supplied source.
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
tempfile.workspace = true
# #1071: the conformance suite builds an anchored runtime, whose history source
# is an async trait. Same crate the engine itself uses.
async-trait.workspace = true
# #1081: `start_paused` so the precondition timeout tests assert the budget is
# honoured, not that the machine was fast enough to prove it.
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6"
criterion = { version = "0.5", features = ["html_reports"] }
# JSON-Schema validation for the conformance suite (same validator the
# rigorix-sdk rigorix-verifier uses). Dev-only — never in the published crate.
jsonschema = "0.26"

[[bench]]
name = "dag_engine"
harness = false

# GAP-A-24: converted real unit tests under tests/unit/** (previously inert
# Guardian-TDD stubs that were never compiled).
[[test]]
name = "unit"
path = "tests/unit/mod.rs"

# Contract-sync conformance suite (F-20260907-01/02) — only built when the
# `conformance` feature is on (default `cargo test` stays fast; the CI
# conformance job enables it with RIGORIX_SDK_SCHEMAS set).
[[test]]
name = "conformance"
path = "tests/conformance/mod.rs"
required-features = ["conformance"]

[lints]
workspace = true
