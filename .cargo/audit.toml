[advisories]
# Policy: no silent ignores. This is the single home for advisory decisions;
# do not add `--ignore` flags to workflows or scripts (#1198).
#
# A suppression is only valid with a comment directly above the ID in the form
#
#   # expires: YYYY-MM-DD — why, and the tracking issue
#   "RUSTSEC-YYYY-NNNN",
#
# `validate-decision-expiry.sh` fails when that date has passed or the comment
# is missing, and registers the check as gating (#1203).
#
# 2026-10-24 status: no ignores remain.
#   ctutils 0.4.2 -> 0.4.4          fixed (RUSTSEC-2026-0385)
#   paste 1.0.15                    removed with ratatui 0.30
#   lru 0.12.5                      removed with ratatui 0.30
#   unsafe-libyaml                  removed with serde-saphyr (#1199)
#   zvariant / zbus_names / ...     removed with the keyutils backend (#1200)
