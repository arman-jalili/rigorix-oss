[workspace]
members = ["engine", "cli", "actions", "mcp", "server", "wasm", "wasi"]
resolver = "3"

[workspace.package]
license = "MIT OR Apache-2.0"
authors = ["Arman Wolkensteiner-Jalili and Rigorix contributors"]
edition = "2024"

[workspace.lints.clippy]
# #1083: a restriction lint, allow-by-default — deny it here so plain
# `cargo clippy` catches a new spawn site, not only CI. Configured in clippy.toml.
disallowed_types = "deny"
# #1481 rule 2 (no dropped evidence) is NOT configured here on purpose. Denying
# `let_underscore_must_use` workspace-wide fires on ~50 pre-existing best-effort
# sites (event publishes, temp-file cleanup, channel sends), each of which would
# need an `#[allow]` — a control that becomes a list of exceptions is noise. The
# rule is denied where it is about evidence: the module roots of `audit/`,
# `orchestrator/` and `precondition/` carry
# `#![deny(clippy::let_underscore_must_use)]`, and
# `.pi/scripts/validate-sink-register.sh` scans every `let _ =` on those paths
# for the `// sink: <id>` excuse.

[workspace.dependencies]
# Shared external dependencies (single version across all crates)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
sha2 = "0.11"
hmac = "0.13"
rand = "0.8"
hex = "0.4"
regex = "1"
tempfile = "3"

