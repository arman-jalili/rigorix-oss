# ═════════════════════════════════════════════════════════════════════
# Rigorix CI — the merge gate.
#
# Runs on pull requests to main, and on every push to main.
#
# Thirteen jobs: eleven stages, an aggregate (`ci-report`) and a verdict
# (`gate`, which requires every mandatory stage). Coverage runs here, not in
# hardening.yml. Which stage requires which is declared in
# `.github/ci-graph.tsv`, and `.github/scripts/ci_graph_check.sh` fails when
# that file and this workflow disagree — so the graph is the only stage list,
# and a second one here could only drift.
# ═════════════════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # #1439: an incremental `target/` cannot be shared between jobs — the incremental dirs are
  # per-build and restoring them from a cache written by another job produces rebuilds that
  # look like hits. Cargo's own docs say the same; this is the flag that stops it.
  CARGO_INCREMENTAL: "0"

# A pull request replaces its predecessor; a merge on main never does. So a pull request
# shares one group per PR, and every other run gets a group of its own — a group with a
# single member has nothing older to cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # ── Stage −1: what this diff can reach (#1441) ────────────────
  #
  # The map in `.github/ci-affected.tsv` decides which subjects this change can reach, and
  # every stage below is gated on it. Three outputs and one rule:
  #
  #   all       every subject is required (a shared path, or a diff nobody could read)
  #   subjects  the jobs to run, space-padded so ` a ` cannot match ` ab `
  #   crates    the matrix for `lint` and `test` — a crate the diff cannot reach is not run
  #
  # Fail closed throughout: no diff, an unresolvable base, or a path that matches no row all
  # mean `all=true`. A pipeline that cannot see what changed runs everything, loudly.
  affected:
    name: 🗺 What this diff can reach
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      all: ${{ steps.map.outputs.all }}
      subjects: ${{ steps.map.outputs.subjects }}
      crates: ${{ steps.map.outputs.crates }}
    steps:
      - uses: actions/checkout@v4
      - name: 🗺 Read the diff, derive the subjects
        id: map
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          files=""
          # `github.event.before` is all zeros on a branch's first push, and a compare against
          # it is a compare against nothing. Both cases fall through to "run everything".
          case "${BASE:-}" in
            "" | 0000000000000000000000000000000000000000) : ;;
            *)
              files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD_SHA" \
                --jq '.files[].filename' 2>/dev/null || true) ;;
          esac
          if [ -z "$files" ]; then
            echo "::notice title=Running every subject::no readable diff — the map cannot narrow this run"
            bash .github/scripts/ci_affected.sh --all --github >> "$GITHUB_OUTPUT"
          else
            # Word splitting on the file list is the point: `--files` takes arguments.
            # shellcheck disable=SC2086
            bash .github/scripts/ci_affected.sh --github --files $files >> "$GITHUB_OUTPUT"
          fi
          echo "── the map says:"
          cat "$GITHUB_OUTPUT" | tail -3

  # ── Stage 0: Workspace Overview ───────────────────────────────
  workspace:
    name: 📋 Workspace
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.crates.outputs.matrix }}
      packages: ${{ steps.crates.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - name: 🕸 The CI graph is the declared one
        # `.github/ci-graph.tsv` is the source; this makes it the source rather than a
        # description. It refuses a `needs` naming `lint`, an edge with no row, a row with
        # no edge, and any disagreement between the two — the class of defect that once hid
        # seven stages behind one edge while the gate still reported a verdict (#1411).
        run: bash .github/scripts/ci_graph_check.sh
      - name: 🧰 Every cargo job restores one workspace cache
        # #1439: `actions/cache` keyed per job meant fourteen copies of one compiled workspace
        # and no job able to restore another's. One `shared-key`, saved on main only, and
        # `--locked` on every invocation — a cache that hides a lockfile drift is worse than a
        # cold build. Seeds: no `shared-key`, no cache at all, a missing `--locked`, and a
        # per-job `actions/cache` on `target/` growing back.
        run: bash .github/scripts/validate-workflows.sh --self-test
      - name: 🧮 The conventions suite runs once, and somewhere
        # #1438: the `check_*.sh` suite is one subject; it ran in five jobs, and the copy in
        # the deleted `build` job is why five stages waited eleven minutes for a job that
        # uploaded nothing. The census refuses a second invocation, a repo-root invocation
        # (which skips out green), and a crate whose directory the loop visits but checks
        # nothing in.
        run: bash .github/scripts/check_conventions_census.sh --self-test
      - name: 🧷 main's verification is never cancelled
        # #1422: the concurrency block decides whether a merge commit gets a run of its own.
        # Checked before the matrix so it is the cheapest thing this workflow refuses.
        run: bash .github/scripts/workflow_concurrency_check.sh --self-test
      - name: 🔍 Detect workspace crates
        id: crates
        shell: bash
        run: |
          CRATES=$(for d in */; do
            [ -d "${d}.pi/scripts" ] && echo "${d%/}"
          done | jq -R -s -c 'split("\n") | map(select(length > 0))')
          # Directory name -> package name, resolved from the manifest. The four original
          # crates happen to be `rigorix-<dir>`, but the gate crate is deliberately
          # `rigorix-gate-wasm` (ADR-011: crate and npm package names are a public
          # commitment), so the matrix must not infer the package from the directory.
          PACKAGES=$(for d in */; do
            [ -f "${d}Cargo.toml" ] && [ -d "${d}.pi/scripts" ] && \
              jq -n --arg dir "${d%/}" --arg pkg "$(grep -m1 '^name =' "${d}Cargo.toml" | sed 's/name = "//;s/"//')" \
                '{($dir): $pkg}'
          done | jq -s 'add // {}' -c)
          echo "matrix=$CRATES" >> "$GITHUB_OUTPUT"
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "Crates: $CRATES"
          echo "Packages: $PACKAGES"

  # ── Stage 1: Lint (fmt + clippy) ──────────────────────────────
  lint:
    name: 🔎 Lint (${{ matrix.crate }})
    needs: [affected, workspace]
    if: contains(needs.affected.outputs.subjects, ' lint ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The crates this diff can reach, not all of them (#1441). The job itself is gated on
        # `lint`/`test` being required, so the matrix is never empty when it runs.
        crate: ${{ fromJson(needs.affected.outputs.crates) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: lint-${{ matrix.crate }}
      - run: cargo fmt --check -p "${{ fromJson(needs.workspace.outputs.packages)[matrix.crate] }}"
      - run: cargo clippy --locked -p "${{ fromJson(needs.workspace.outputs.packages)[matrix.crate] }}" -- -D warnings
      - name: Per-crate conventions (conformance suite)
        # GAP-A-27: conventions gate the job — and now gate it *once*. The suite ran in five
        # jobs before #1438 (`lint`, `build`, `test`, `docs`, `integration`): five executions of
        # one verdict, and the copy in `build` was the whole reason five stages waited eleven
        # minutes for a job that handed them nothing. Scope is the `check_*.sh` suite (contract
        # implementations, DDD structure, architecture conformance); run_/stage_/validate_*
        # orchestrators need arguments and are not part of it.
        run: |
          for script in .pi/scripts/ci/check_*.sh; do
            [ -f "$script" ] && echo "--- $script ---" && bash "$script"
          done
        working-directory: ${{ matrix.crate }}

  # ── Stage 3: Test ─────────────────────────────────────────────
  test:
    name: 🧪 Test (${{ matrix.crate }})
    needs: [affected, workspace]
    if: contains(needs.affected.outputs.subjects, ' test ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The crates this diff can reach, not all of them (#1441). The job itself is gated on
        # `lint`/`test` being required, so the matrix is never empty when it runs.
        crate: ${{ fromJson(needs.affected.outputs.crates) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: test-${{ matrix.crate }}
      - name: Tests for this crate
        # No `--lib`: that selects a *target*, not the crate's tests. `rigorix-gate-wasm` keeps
        # all 195 of its tests in the `unit` integration binary and has no `#[cfg(test)]` in
        # `src/`, so `--lib` compiled a target with zero tests and nextest exited 4 ("no tests
        # to run") — the honest failure, and the reason this is not silenced with
        # `--no-tests=warn`. `local-ci.sh` has always run the crate's full set.
        run: cargo nextest run --locked -p "${{ fromJson(needs.workspace.outputs.packages)[matrix.crate] }}" --profile unit
      - name: Doctests for this crate (#1373)
        # `cargo nextest` runs no doc tests, so deleting `cargo test` without this step
        # would delete a coverage channel and leave the job green. Per-crate run: a crate
        # with no floor is reported and not judged (five of the six have never had one);
        # the crate that carries the channel has a floor in .pi/doctest-floors.tsv.
        env:
          PKG: ${{ fromJson(needs.workspace.outputs.packages)[matrix.crate] }}
        run: bash .pi/scripts/run-doctests.sh -p "$PKG"

  # ── Stage 3c: Portable slice (ADR-014 §1, #1374) ───────────────
  # A configuration outside CI is a configuration that rots: without this job
  # `--features portable` would be a decision nothing builds, and the first
  # person to try it would meet a build-script failure rather than a named module.
  portable:
    name: 🧳 Portable slice
    # `[affected, workspace]` only, deliberately (#1407 follow-up, #1441). This job consumes no build
    # artifact — it compiles the slice for wasm32, runs `cargo test -p rigorix-engine
    # --features portable --tests` and validates the inventory against the cfg gates. Making
    # it depend on `build` (which depends on `lint`) meant a red lint job in *any* crate
    # skipped it, and the slice's 897 native tests stopped running while the stage still
    # read as configured. An independent subject must fail on its own subject, not inherit
    # someone else's; the Final Gate still fails on the lint job itself.
    if: contains(needs.affected.outputs.subjects, ' portable ')
    needs: [affected, workspace]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: portable
      - name: The slice compiles for wasm32
        # ADR-014 §1: the engine compiles for `wasm32-unknown-unknown` with
        # `--features portable`.
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --locked -p rigorix-engine --features portable --target wasm32-unknown-unknown
      - name: No forbidden crate in the wasm32 graph
        # #1412: the step calls the owner. `wasm/ci/check-bundle-independence.sh` holds the
        # list, the reason per entry and the tokio feature-set rule; a second inline list here
        # disagreed with it (six names against ten, plus `ring` which the script permitted) and
        # its success line counted neither. The script's subject is the shipped crate's graph,
        # which is what ADR-014's independence claim is about.
        #
        # The script is fail-closed: it refuses when the tree cannot be computed.
        run: bash wasm/ci/check-bundle-independence.sh
      - name: The slice's own tests run natively
        # `--tests`, not the whole suite: an example demonstrating an excluded module
        # cannot exist in the slice, and gating an example file leaves no `main` (E0601).
        run: cargo test --locked -p rigorix-engine --features portable --tests
      - name: Manifest versus cfg gates, both directions
        # A gate with no row is an exclusion nobody reviewed; a row with no gate is a
        # claim about a build that still compiles the module. The compiler can say
        # neither: removing a gate names a build script (`tree-sitter`), not the module.
        run: bash .pi/scripts/validate-portable-inventory.sh --gates

  # ── Stage 3b: Coverage (real line coverage via cargo-llvm-cov) ──
  coverage:
    name: 📊 Coverage (workspace)
    if: contains(needs.affected.outputs.subjects, ' coverage ')
    needs: [affected, workspace]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # #1427: the floors guard compares `.pi/coverage-layers.tsv` with the base commit.
          # Two commits are enough — `origin/main` for a pull request, `HEAD~1` for a run on
          # `main` itself — and the explicit fetch below supplies the first.
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          cache-key: coverage
      - run: bash .pi/scripts/install_coverage_tools.sh
      - name: Coverage — workspace lines (gated at 60%, baseline 78.92%)
        # #1348: the gate reads the TOTAL row's **Lines** column, found by
        # header. It used to take the first percentage on the row, which is
        # Regions, and print it as "Line coverage".
        run: bash .pi/scripts/coverage.sh --gate --lcov
      - name: Coverage — per-layer line floors (ratchet)
        # The three thresholds the roadmap documents (domain ≥95, application
        # ≥90, interface ≥85) had no gate that read them: the only gate was
        # workspace-wide at 60%. Each layer is now measured on its own slice and
        # cannot regress below the floor in .pi/coverage-layers.tsv; the target
        # is printed beside it with the gap, so an unmet criterion reads as a
        # gap rather than as a threshold something enforces.
        run: bash .pi/scripts/coverage.sh --gate-layers
      - name: 📉 Coverage floors never fall (#1427)
        # The other half of the ratchet, and the half that was only a sentence: a floor may
        # not be lowered, and a layer may not lose its row. Compared with `origin/main` on a
        # pull request and with `HEAD~1` on `main`, so the check reads history rather than a
        # hardcoded number.
        #
        # `--depth=2` is load-bearing. The first version of this step fetched `--depth=1`,
        # which on a push to `main` makes HEAD its own shallow boundary: `origin/main` then
        # equals HEAD and `HEAD~1` is gone, so the guard failed in 1 s with "nothing to
        # compare" (run 42079709444). Two commits is exactly what the fallback needs.
        run: |
          git fetch --no-tags --depth=2 origin +refs/heads/main:refs/remotes/origin/main
          bash .pi/scripts/validate-coverage-floors.sh --base origin/main
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: target/coverage.lcov
          if-no-files-found: error

  # ── Stage 4: Security ─────────────────────────────────────────
  audit:
    name: 🔒 Audit
    if: contains(needs.affected.outputs.subjects, ' audit ')
    needs: [affected]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Advisory policy lives in .cargo/audit.toml (reviewed ignores with
      # tracking issues and expiry). Do not add --ignore flags here (#1198).
      - run: cargo audit
      - name: Secret scan
        shell: bash
        run: |
          results=$(grep -rE "(sk-[A-Za-z0-9]{32,}|ghp_[A-Za-z0-9]{36}|AKIA[0-9A-Z]{16})" \
            --include="*.rs" --include="*.toml" --include="*.yml" --include="*.yaml" \
            --include="*.env" --include="*.sh" . 2>/dev/null \
            | grep -v ".git" | grep -v ".rigorix" | grep -v "ghp_secret12345" \
            | grep -v "AKIAIOSFODNN7EXAMPLE" || true)
          if [[ -n "$results" ]]; then
            echo "❌ Secrets found:"
            echo "$results"
            exit 1
          fi
          echo "✅ No secrets detected"
      # Self-owned vulnerability checks (ISSUE-SELF-OWNED-VULN-CHECKS).
      #
      # A Rust panic aborts the process (in a runner/host there is no caller to
      # catch it), a production `unsafe` block is a promise the compiler cannot
      # check, and a secret in a log line is a disclosure. Each class has a
      # scanner + a baseline and is a RATCHET: existing debt is frozen, new debt
      # fails the build. .pi/guards.tsv marks WHICH guards gate; everything else
      # is advisory and cannot stop a merge (list them: validate-guards.sh --list).
      - name: Self-owned guards (panic / unsafe / secret-in-log)
        shell: bash
        run: bash .pi/scripts/validate-guards.sh
      - name: Guard self-tests (each gating guard fails on a planted regression)
        shell: bash
        run: bash .pi/scripts/validate-guards.sh --self-test
      # NOTE: the "Root + per-crate scripts" convention loop is deliberately
      # NOT run here. It takes ~20 min (runs every proofing/stage script,
      # each of which may execute full test suites) and blew the job's
      # 25-min timeout at teardown. It is non-gating (continue-on-error)
      # everywhere and is already executed by the docs and integration jobs.
      # The audit stage's job is security only: dependency audit + secret scan.

  # ── Stage 5: Documentation + Architecture ─────────────────────
  docs:
    name: 📝 Documentation
    if: contains(needs.affected.outputs.subjects, ' docs ')
    needs: [affected]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Per-crate architecture + docs conventions
        # GAP-A-27: conventions gate the stage. Canonical/architecture/readiness doc validators
        # (local-ci Stage 5); the `check_*.sh` suite is `lint`'s, once.
        shell: bash
        run: |
          # #1412: the loop variable is `pkg`, not `crate`. These blocks iterate workspace
          # directories, and a `crate` loop variable made the acceptance grep for the (now
          # deleted) forbidden-crate loop match five unrelated lines.
          for pkg in engine mcp cli actions; do
            # The `check_*.sh` suite is not repeated here: it gates `lint`, once (#1438). What
            # this stage owns is the doc and architecture verdict over each crate.
            for v in validate-canonical.sh validate-architecture.sh validate-architecture-readiness.sh; do
              [ -f "$pkg/.pi/scripts/$v" ] && echo "--- $v ($pkg) ---" && (cd "$pkg" && bash ".pi/scripts/$v")
            done
          done

  # ── Stage 6: Integration ──────────────────────────────────────
  integration:
    name: 🔗 Integration
    if: contains(needs.affected.outputs.subjects, ' integration ')
    needs: [affected, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: The boundary — only what crosses one (#1440)
        # `--workspace --profile cross-crate`: the binaries that spawn a process, drive a
        # transport, or read another crate's catalog. Everything else already ran in `test`,
        # once, per crate (`--profile unit`); running `--workspace` here re-ran the whole
        # suite under a second label and decided nothing new. The partition is declared in
        # `.config/nextest.toml` and `check_test_census.sh` refuses a binary claimed twice,
        # claimed by nothing, or a filter that matches nothing.
        run: cargo nextest run --locked --workspace --profile cross-crate
      - name: No silent retry (#1373)
        # A retried pass is a normalised comparison. The key must not exist in the
        # nextest config, and this asserts the key rather than the prose.
        shell: bash
        run: |
          if grep -qE '^\s*retries\s*=' .config/nextest.toml; then
            echo "::error::.config/nextest.toml enables retries; a retried pass is not a pass"
            grep -nE '^\s*retries\s*=' .config/nextest.toml
            exit 1
          fi
          echo "✅ no retry keys configured"
      - name: Doctests — the channel nextest does not run (#1373)
        # Required, with its count printed; a run that executes zero doctests fails.
        run: bash .pi/scripts/run-doctests.sh
      - name: CLI pinned-inputs surface (#1369)
        # The feature is non-default, so `cargo test --workspace` proves only the absence half of
        # the pair in `cli/tests/pinned_inputs_surface.rs`. Both halves must run: one fails if the
        # command leaks into a default build, the other if the feature stops adding it.
        run: |
          cargo test --locked -p rigorix-cli --test pinned_inputs_surface
          cargo test --locked -p rigorix-cli --features pinned-inputs --test pinned_inputs_surface
      - name: Per-crate integration + operations validators
        # GAP-A-27: conventions gate the stage. Root integration/operations validators
        # (local-ci Stage 6); the `check_*.sh` suite is `lint`'s, once.
        shell: bash
        run: |
          # The `check_*.sh` suite gates `lint`, once (#1438). This stage's subject is the
          # boundary: what only runs when several crates are exercised together.
          # Run the PER-CRATE copies, not the repo-root dispatcher. From the
          # repo root the root copy has no `src/` to inspect, so it skipped out
          # with a green summary while the real check never ran. Each crate's own
          # copy resolves its tree from its own path (see the preamble in
          # languages/rust/validate-*.sh).
          for v in validate-integration.sh validate-operations.sh; do
            for pkg in engine mcp cli actions; do
              [ -f "$pkg/.pi/scripts/$v" ] && echo "--- $pkg $v ---" && bash "$pkg/.pi/scripts/$v"
            done
          done

  # ── Stage 6b: SDK-schema conformance (contract-sync) ─────────
  #
  # F-20260907-01/02 (contract-sync milestone 1): validates REAL engine
  # output against rigorix-sdk schemas (schemas/envelope.json | policy.json |
  # claims.json v1 @ rigorix-sdk main). rigorix-sdk is same-owner private —
  # checked out with the RIGORIX_SDK_TOKEN secret. Runs the feature-gated
  # conformance suite (engine [[test]] conformance, required-features).
  #
  # The independent-HMAC proof (engine-signed envelope verified byte-exact by
  # rigorix-verifier) runs in rigorix-sdk CI via the committed
  # schemas/fixtures/envelope corpus + the verifier fixture test.
  conformance:
    name: 📐 SDK-schema conformance
    if: contains(needs.affected.outputs.subjects, ' conformance ')
    needs: [affected]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: conformance-${{ runner.os }}
      - name: 🔑 Checkout rigorix-sdk (same-owner private, schema source of truth)
        uses: actions/checkout@v4
        with:
          repository: arman-jalili/rigorix-sdk
          token: ${{ secrets.RIGORIX_SDK_TOKEN }}
          # rigorix-sdk#1 (fixtures + sorted-key parity) has merged, so track
          # main — the schema source of truth.
          ref: main
          path: rigorix-sdk
      - name: 🧪 Conformance tests (engine output vs SDK schemas)
        env:
          RIGORIX_SDK_SCHEMAS: ${{ github.workspace }}/rigorix-sdk/schemas
        run: |
          cargo test --locked -p rigorix-engine --features conformance --test conformance
      - name: 🔗 MCP ↔ catalog drift (ADR-0001 adapter table)
        # Every MCP tool must map 1:1 to a frozen rigorix.* catalog method.
        env:
          RIGORIX_SDK_SCHEMAS: ${{ github.workspace }}/rigorix-sdk/schemas
        run: |
          cargo test --locked -p rigorix-mcp --bin rigorix-mcp catalog_drift_tests
      - name: 📚 Server catalog subset (ADR-0001 D3)
        # The OSS server catalog must be a SUBSET of the frozen rigorix.* catalog
        # (never equality: the SDK also declares enterprise `rigorix.auth.verify`).
        # Run WITH the schemas so the check does not silently skip.
        env:
          RIGORIX_SDK_SCHEMAS: ${{ github.workspace }}/rigorix-sdk/schemas
        run: |
          cargo test --locked -p rigorix-server --test catalog_parity oss_catalog_is_a_subset_of_the_sdk_catalog -- --nocapture
      - name: 🔁 Independent-HMAC proof (engine fixtures via rigorix-verifier)
        # Strategy A: the engine's own canonicalization must be reproducible
        # byte-exact by the SDK's protocol-only verifier. Runs the verifier
        # suite — its engine_signed_fixtures_verify_byte_exact test validates
        # every committed schemas/fixtures/envelope/*.json.
        run: |
          cargo test --locked --manifest-path rigorix-sdk/rust/Cargo.toml -p rigorix-verifier

  # ── Stage 6b: Shell exit status ───────────────────────────────
  # `(( x++ ))` returns 1 when the result is 0, so the first increment of a
  # counter that starts at 0 fails. bash 3.2 hides it; bash 4.4+ (this runner)
  # ends the script — silently, before any verdict is printed (#1291).
  shell:
    name: 🐚 Shell exit status
    if: contains(needs.affected.outputs.subjects, ' shell ')
    needs: [affected]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 🔐 errexit arithmetic (no script may end on `(( x++ ))`)
        run: bash .pi/scripts/validate-shell-exit-status.sh
      - name: 🧮 CI stage table (a hyphenated job id must still resolve)
        # `wasm-gates` -> RESULT_WASM_GATES. When this was wrong, a green job read as
        # `missing` and the merge gate failed on a stage that had passed.
        run: bash .github/scripts/ci_stages.sh --self-test

  # ── Stage 7: Stage report ─────────────────────────────────────
  # Always runs, always green: it exists so a superseded run still shows
  # *which* stages reported `cancelled` (#1289) — the Final Gate is skipped in
  # that case and could not tell that story.

  # ── Stage 7: wasm gates (criterion-level checks for rigorix-gate-wasm) ──
  wasm-gates:
    name: 🧭 wasm gates
    if: contains(needs.affected.outputs.subjects, ' wasm-gates ')
    needs: [affected]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # The same key as `.github/actions/setup` (#1439): this job shares a workspace
          # compilation with the other cargo jobs instead of paying for its own.
          shared-key: workspace-v1
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: 🧱 Install wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: 🔖 Resolve the wasm-bindgen version the crate uses
        # The module smoke gate packages the artifact with this exact CLI: a
        # mismatch is an ABI mismatch, so the version comes from the lockfile
        # rather than being restated here and drifting (#1349).
        run: |
          V=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/[",]/, "", $3); print $3; exit }' Cargo.lock)
          test -n "$V" || { echo "could not resolve wasm-bindgen from Cargo.lock"; exit 1; }
          echo "WASM_BINDGEN_VERSION=$V" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-${{ env.WASM_BINDGEN_VERSION }}-${{ runner.os }}
      - name: 🔧 wasm-bindgen CLI (the packaging step, pinned)
        # Without it the smoke gate fails: a module that is never packaged is a
        # module no host can call, which is what #1349 is about.
        run: |
          if command -v wasm-bindgen > /dev/null 2>&1; then
            wasm-bindgen --version
          else
            cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
          fi
      - name: 🧭 Run every wasm gate
        # One entrypoint, and all eleven of its gates: domain isolation, bundle independence,
        # failure tiers, conformance (including the must-fail vector), unit tests, the wasm
        # release build, the module smoke gate (a host can call it), the size budget,
        # workspace pins and host verification.
        #
        # `--with-npm` because CI has npm, and because the suite must *count* host
        # verification: it was declared inside the `--with-npm` branch and invisible to the
        # count, so the local run reported "10 gates passed" while the failing gate was the
        # eleventh (#1421). A separate step here would declare the same gate twice.
        run: bash wasm/ci/run-wasm-gates.sh --with-npm

  # The required check is the aggregate (#1422), not a subset: `ci-report` depends on every
  # mandatory stage, so a merge cannot pass on the stages that happened to finish. Which
  # check branch protection *requires* is a repository setting, not code — require
  # `ci-report` there (`📋 Stage report`).
  ci-report:
    name: 📋 Stage report
    needs: [affected, lint, test, coverage, portable, audit, docs, integration, conformance, shell, wasm-gates]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 📋 Stage results
        env:
          # What this diff required, from the same table the stages read (#1441). A stage the
          # map did not select is reported as "not required", never as a pass and never as a
          # failure — and a *required* stage that was skipped is still a failure.
          CI_ALL: ${{ needs.affected.outputs.all }}
          CI_SELECTED: ${{ needs.affected.outputs.subjects }}
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_COVERAGE: ${{ needs.coverage.result }}
          RESULT_PORTABLE: ${{ needs.portable.result }}
          RESULT_AUDIT: ${{ needs.audit.result }}
          RESULT_DOCS: ${{ needs.docs.result }}
          RESULT_INTEGRATION: ${{ needs.integration.result }}
          RESULT_CONFORMANCE: ${{ needs.conformance.result }}
          RESULT_SHELL: ${{ needs.shell.result }}
          RESULT_WASM_GATES: ${{ needs.wasm-gates.result }}
        run: .github/scripts/ci_report.sh

  # ── Stage 8: Final Gate ───────────────────────────────────────
  gate:
    name: 🚪 Final Gate
    needs: [affected, lint, test, coverage, portable, audit, docs, integration, conformance, shell, wasm-gates]
    # A superseded run gets no verdict (#1289). `cancelled` is the scheduler's
    # fact, not the change's: with `cancel-in-progress` every push to the same
    # ref cancels the previous run, so the old `!= 'success'` test accused the
    # commit of a failure that never ran. Skipped (grey) rather than green —
    # green would be a verdict too. The report job above prints the stages.
    if: always() && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🚦 Verdict
        env:
          # What this diff required, from the same table the stages read (#1441). A stage the
          # map did not select is reported as "not required", never as a pass and never as a
          # failure — and a *required* stage that was skipped is still a failure.
          CI_ALL: ${{ needs.affected.outputs.all }}
          CI_SELECTED: ${{ needs.affected.outputs.subjects }}
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_COVERAGE: ${{ needs.coverage.result }}
          RESULT_PORTABLE: ${{ needs.portable.result }}
          RESULT_AUDIT: ${{ needs.audit.result }}
          RESULT_DOCS: ${{ needs.docs.result }}
          RESULT_INTEGRATION: ${{ needs.integration.result }}
          RESULT_CONFORMANCE: ${{ needs.conformance.result }}
          RESULT_SHELL: ${{ needs.shell.result }}
          RESULT_WASM_GATES: ${{ needs.wasm-gates.result }}
        run: .github/scripts/ci_verdict.sh
