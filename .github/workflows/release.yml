# ═════════════════════════════════════════════════════════════════════
# Rigorix Release — Publish crates to crates.io
#
# Triggered by pushing a git tag matching v*.*.*
# Pre-requisite: run CI + Hardening first (manual approval gate)
# ═════════════════════════════════════════════════════════════════════

name: Release

on:
  push:
    tags: ["v*.*.*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Gate: Verify tag matches Cargo.toml versions ──────────────
  verify:
    name: 🔍 Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version consistency
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG_VERSION"

          # `actions` IS on the train. It used to be excluded, and the exclusion
          # hid a real defect: nothing bumped its version, so `publish-crate.sh`
          # skipped it as "already published" on every release and the crate sat
          # on 1.4.0 for seven weeks while `actions/` took 307 lines of change.
          # An excluded crate is an unreleased crate; the gate is what makes
          # `skip if exists` mean "rerun" instead of "never".
          for crate in engine cli mcp actions; do
            CRATE_VERSION=$(grep '^version' "$crate/Cargo.toml" | head -1 | sed 's/version = "//;s/"//')
            echo "$crate: $CRATE_VERSION"
            if [[ "$CRATE_VERSION" != "$TAG_VERSION" ]]; then
              echo "❌ $crate version $CRATE_VERSION != tag $TAG_VERSION"
              exit 1
            fi
          done
          echo "✅ All versions match tag"

  # ── Publish each crate in dependency order ────────────────────
  # Each step delegates to .github/scripts/publish-crate.sh, which asks the
  # registry directly and treats "already exists" as success (idempotent replay).
  publish-engine:
    name: 📦 Publish engine
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Publish rigorix-engine (skip if exists)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash .github/scripts/publish-crate.sh rigorix-engine engine/Cargo.toml

  publish-cli:
    name: 📦 Publish CLI
    needs: [publish-engine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Publish rigorix-cli (skip if exists)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash .github/scripts/publish-crate.sh rigorix-cli cli/Cargo.toml

  publish-mcp:
    name: 📦 Publish MCP
    needs: [publish-engine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Publish rigorix-mcp (skip if exists)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash .github/scripts/publish-crate.sh rigorix-mcp mcp/Cargo.toml

  publish-actions:
    name: 📦 Publish actions
    needs: [publish-engine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Publish rigorix-actions (skip if exists)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash .github/scripts/publish-crate.sh rigorix-actions actions/Cargo.toml

  # ── Create GitHub Release ─────────────────────────────────────
  github-release:
    name: 🏷️ GitHub Release
    # `needs` lists the release train, and `publish-actions` is part of it: the
    # actions crate carries the same version as the engine it adapts, so a release
    # page that omits it would advertise a train with a missing car. The `verify`
    # gate now requires all four versions to equal the tag, so the only way
    # `publish-actions` skips is a rerun, where the skip is correct.
    needs: [publish-engine, publish-cli, publish-mcp, publish-actions]
    # Announce the release only once every train crate is actually on crates.io.
    # Previously `if: always()`, which meant a failed publish still produced a
    # release page advertising crates that did not exist in the registry — the
    # v1.9.5 runs did exactly that before the skip-guard was fixed. `success()`
    # is the default for a job with `needs`; it is written out so the intent
    # survives future edits.
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate changelog
        shell: bash
        run: |
          # Name the exact version and crates this tag actually published.
          # The notes previously listed `rigorix-actions` under "Crates
          # Published" for a `v1.9.5` tag although that crate was still at 1.4.0
          # at the time — a reader would infer a version that did not exist.
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "# Rigorix ${{ github.ref_name }}"
            echo ""
            echo "Release train: \`engine\` / \`mcp\` / \`cli\` / \`actions\` → \`$VERSION\`."
            echo ""
            # Point at the repo's changelog (CHANGELOG.md). This previously read
            # `.pi/architecture/CHANGELOG.md`, which is the GUARDIAN framework's
            # generated architecture change log (`DO NOT EDIT GENERATED FILES`),
            # mirrored into 5 trees — every release therefore linked readers to a
            # document that is not Rigorix's release history at all.
            echo "See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for release history."
            echo ""
            echo "## Crates published to crates.io"
            echo "- [rigorix-engine $VERSION](https://crates.io/crates/rigorix-engine/$VERSION)"
            echo "- [rigorix-mcp $VERSION](https://crates.io/crates/rigorix-mcp/$VERSION)"
            echo "- [rigorix-cli $VERSION](https://crates.io/crates/rigorix-cli/$VERSION)"
            echo "- [rigorix-actions $VERSION](https://crates.io/crates/rigorix-actions/$VERSION)"
          } > release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
