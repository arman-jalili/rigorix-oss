# ═════════════════════════════════════════════════════════════════════
# Rigorix Release — Publish crates to crates.io
#
# Triggered by pushing a git tag matching v*.*.*
# Pre-requisite: run CI + Hardening first (manual approval gate)
# ═════════════════════════════════════════════════════════════════════

name: Release

on:
  push:
    tags: ["v*.*.*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Gate: Verify tag matches Cargo.toml versions ──────────────
  verify:
    name: 🔍 Verify
    runs-on: ubuntu-latest
    # `npm_ready` is read from the committed readiness state, not guessed. `hashFiles`
    # cannot be used for this: a job-level `if` is evaluated before `actions/checkout`, so
    # it would answer "no artifact" forever and quietly never publish.
    outputs:
      npm_ready: ${{ steps.npm.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version consistency
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG_VERSION"

          # `actions` IS on the train. It used to be excluded, and the exclusion
          # hid a real defect: nothing bumped its version, so `publish-crate.sh`
          # skipped it as "already published" on every release and the crate sat
          # on 1.4.0 for seven weeks while `actions/` took 307 lines of change.
          # An excluded crate is an unreleased crate; the gate is what makes
          # `skip if exists` mean "rerun" instead of "never".
          #
          # This literal is not the source of truth: `.pi/scripts/validate-release-train.sh`
          # derives the train from `cargo metadata` and fails when a publishable member is
          # missing from this loop, from the publish steps, or from the release notes. A
          # literal cannot notice the next member — that is how `actions` sat on 1.4.0.
          for crate in engine cli mcp actions wasm server; do
            CRATE_VERSION=$(grep '^version' "$crate/Cargo.toml" | head -1 | sed 's/version = "//;s/"//')
            echo "$crate: $CRATE_VERSION"
            if [[ "$CRATE_VERSION" != "$TAG_VERSION" ]]; then
              echo "❌ $crate version $CRATE_VERSION != tag $TAG_VERSION"
              exit 1
            fi
          done
          echo "✅ All versions match tag"

      - name: Read npm packaging readiness
        id: npm
        shell: bash
        # The vocabulary has one owner: `validate-release-train.sh --npm-ready`. It used to be
        # copied here, and the copies drifted — this step rejected `packaged` while the guard
        # accepted it, so a valid tag could not publish. Ask, do not restate.
        run: |
          state=$(sed -n 's/^state:[[:space:]]*\([^[:space:]]*\).*/\1/p' wasm/ci/bundle-budget.txt | head -1)
          ready=$(bash wasm/.pi/scripts/validate-release-train.sh --npm-ready "$state") || exit 1
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = true ]; then
            echo "bundle state: $state — rigorix-gate will be published to npm"
          else
            echo "bundle state: $state — rigorix-gate is on the train but NOT published by this tag"
            echo "  (no version has shipped from it yet; see wasm/ci/bundle-budget.txt)"
          fi

  # ── Publish each crate in dependency order ────────────────────
  # Each step delegates to .github/scripts/publish-crate.sh, which asks the
  # registry directly and treats "already exists" as success (idempotent replay).
  publish-engine:
    name: 📦 Publish engine
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Publish rigorix-engine (skip if exists)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash .github/scripts/publish-crate.sh rigorix-engine engine/Cargo.toml

  publish-cli:
    name: 📦 Publish CLI
    needs: [publish-engine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Publish rigorix-cli (skip if exists)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash .github/scripts/publish-crate.sh rigorix-cli cli/Cargo.toml

  publish-mcp:
    name: 📦 Publish MCP
    needs: [publish-engine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Publish rigorix-mcp (skip if exists)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash .github/scripts/publish-crate.sh rigorix-mcp mcp/Cargo.toml

  publish-actions:
    name: 📦 Publish actions
    needs: [publish-engine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Publish rigorix-actions (skip if exists)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash .github/scripts/publish-crate.sh rigorix-actions actions/Cargo.toml

  publish-wasm:
    name: 📦 Publish gate (crates.io)
    # ADR-011 registration point 4. On the train from the start, even while the `engine`
    # feature is off: registration is about the version not drifting silently, not about
    # shipping today. Ordered after `publish-engine` because the crate pins the engine
    # version it was written against.
    needs: [publish-engine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Publish rigorix-gate-wasm (skip if exists)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash .github/scripts/publish-crate.sh rigorix-gate-wasm wasm/Cargo.toml

  publish-server:
    name: 📦 Publish server (crates.io)
    # The OSS reference host: `POST /rpc` over the same frozen catalog the MCP binary
    # serves, with the same host composition. It pins `rigorix-mcp` and
    # `rigorix-engine`, so it publishes after them.
    needs: [publish-mcp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Publish rigorix-server (skip if exists)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash .github/scripts/publish-crate.sh rigorix-server server/Cargo.toml

  publish-wasm-npm:
    name: 📦 Publish gate (npm)
    # ADR-011 registration point 5: the host-facing name is `rigorix-gate`, and it ships
    # at the same version as the engine. Idempotent (`npm view` before `npm publish`), so a
    # replay of a finished tag is a skip rather than a red job.
    #
    # `rigorix-gate@1.13.0` is on npm, so `wasm/ci/bundle-budget.txt` says `state: shipped`
    # and this job gates the release page: a page must not announce a version npm does not
    # carry. `.pi/scripts/validate-release-train.sh` enforces the coupling in both directions,
    # so neither the state nor this wiring can change alone.
    #
    # The steps build what they publish: `wasm/pkg` is gitignored, and the smoke gate is the
    # packaging path (build, `wasm-bindgen --target nodejs`, strip, assert the exports).
    needs: [verify, publish-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # `wasm/pkg` is gitignored, so this job used to publish a directory no step had written:
      # the script's first refusal would have fired, and nobody saw it because the job was
      # skipped while the state was `packaged`. The smoke gate *is* the packaging path — it
      # builds, runs `wasm-bindgen --target nodejs`, strips the debug `name` section and
      # asserts the exports — so npm ships the artifact the gates measured, not a second build.
      # The packaging path needs a wasm-bindgen CLI equal to the crate the lockfile
      # pins. This job had never run before v1.14.0, so nothing had noticed it did not
      # have one; the version still comes from one place, not two.
      - uses: ./.github/actions/wasm-bindgen

      # `wasm-build.sh` builds this target and does not install it; `setup` installs the
      # toolchain, not its targets. This job needs it and so do the wasm gates in CI.
      - name: 🧱 Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Build and package the module the gates measure
        run: bash wasm/ci/run-module-smoke.sh

      - name: Publish rigorix-gate (skip if exists)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash .github/scripts/publish-npm-package.sh rigorix-gate wasm/Cargo.toml wasm/pkg

  verify-published:
    name: ✅ Verify the published module
    # The tree being green is not the artifact being right: 1.14.0 shipped
    # `kind: "capacityexceeded"` with 207 tests passing, because nothing had ever
    # driven the tarball the registry serves (#1464). This asks npm for the version
    # the manifest declares, replays the committed capability vectors through it,
    # and asserts the decision digest AND the wire words — every number derived
    # from the vector's own declared world.
    needs: [publish-wasm-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Drive the version the registry serves
        run: node wasm/ci/verify-published-module.mjs

  # ── Create GitHub Release ─────────────────────────────────────
  github-release:
    name: 🏷️ GitHub Release
    # `needs` lists the release train, and `publish-actions` is part of it: the
    # actions crate carries the same version as the engine it adapts, so a release
    # page that omits it would advertise a train with a missing car. The `verify`
    # gate now requires all four versions to equal the tag, so the only way
    # `publish-actions` skips is a rerun, where the skip is correct.
    # `publish-wasm` is on the train (crates.io), and `publish-wasm-npm` gates this page now
    # that the bundle state is `shipped` — the two are wired together because a release page
    # that promises npm without it is the half-published release ADR-011 names.
    needs: [publish-engine, publish-cli, publish-mcp, publish-actions, publish-wasm, publish-server, publish-wasm-npm, verify-published]
    # Announce the release only once every train crate is actually on crates.io.
    # Previously `if: always()`, which meant a failed publish still produced a
    # release page advertising crates that did not exist in the registry — the
    # v1.9.5 runs did exactly that before the skip-guard was fixed. `success()`
    # is the default for a job with `needs`; it is written out so the intent
    # survives future edits.
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate changelog
        shell: bash
        run: |
          # Name the exact version and crates this tag actually published.
          # The notes previously listed `rigorix-actions` under "Crates
          # Published" for a `v1.9.5` tag although that crate was still at 1.4.0
          # at the time — a reader would infer a version that did not exist.
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "# Rigorix ${{ github.ref_name }}"
            echo ""
            echo "Release train: \`engine\` / \`mcp\` / \`cli\` / \`actions\` / \`gate\` / \`server\` → \`$VERSION\`."
            echo ""
            # Point at the repo's changelog (CHANGELOG.md). This previously read
            # `.pi/architecture/CHANGELOG.md`, which is the GUARDIAN framework's
            # generated architecture change log (`DO NOT EDIT GENERATED FILES`),
            # mirrored into 5 trees — every release therefore linked readers to a
            # document that is not Rigorix's release history at all.
            echo "See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for release history."
            echo ""
            echo "## Crates published to crates.io"
            echo "- [rigorix-engine $VERSION](https://crates.io/crates/rigorix-engine/$VERSION)"
            echo "- [rigorix-mcp $VERSION](https://crates.io/crates/rigorix-mcp/$VERSION)"
            echo "- [rigorix-cli $VERSION](https://crates.io/crates/rigorix-cli/$VERSION)"
            echo "- [rigorix-actions $VERSION](https://crates.io/crates/rigorix-actions/$VERSION)"
            echo "- [rigorix-gate-wasm $VERSION](https://crates.io/crates/rigorix-gate-wasm/$VERSION)"
            echo "- [rigorix-server $VERSION](https://crates.io/crates/rigorix-server/$VERSION)"
            # The npm package is announced only when it actually shipped. Reading the
            # readiness state here is what stops the page claiming a package that
            # `publish-wasm-npm` is deliberately holding back.
            if grep -q '^state: shipped' wasm/ci/bundle-budget.txt 2>/dev/null; then
              echo "- [rigorix-gate $VERSION](https://www.npmjs.com/package/rigorix-gate/v/$VERSION)"
            else
              echo ""
              echo "\`rigorix-gate\` on npm is not published at $VERSION — the bundle is still"
              echo "\`awaiting-packaging\` (see \`wasm/ci/bundle-budget.txt\`)."
            fi
          } > release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
