# ═════════════════════════════════════════════════════════════════════
# Rigorix Release — Publish crates to crates.io
#
# Triggered by pushing a git tag matching v*.*.*
# Pre-requisite: run CI + Hardening first (manual approval gate)
# ═════════════════════════════════════════════════════════════════════

name: Release

on:
  push:
    tags: ["v*.*.*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Gate: Verify tag matches Cargo.toml versions ──────────────
  verify:
    name: 🔍 Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version consistency
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG_VERSION"

          for crate in engine cli actions mcp; do
            CRATE_VERSION=$(grep '^version' "$crate/Cargo.toml" | head -1 | sed 's/version = "//;s/"//')
            echo "$crate: $CRATE_VERSION"
            if [[ "$CRATE_VERSION" != "$TAG_VERSION" ]]; then
              echo "❌ $crate version $CRATE_VERSION != tag $TAG_VERSION"
              exit 1
            fi
          done
          echo "✅ All versions match tag"

  # ── Publish each crate in dependency order ────────────────────
  # Each publish step uses a resilient script that skips if the
  # version is already on crates.io (idempotent replay).
  publish-engine:
    name: 📦 Publish engine
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Publish rigorix-engine (skip if exists)
        run: |
          VERSION=$(grep '^version' engine/Cargo.toml | head -1 | sed 's/version = "//;s/"//')
          if cargo search rigorix-engine 2>/dev/null | grep -q "^rigorix-engine = \"$VERSION\""; then
            echo "⏭️ rigorix-engine v$VERSION already published, skipping"
          else
            cargo publish -p rigorix-engine --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          fi

  publish-cli:
    name: 📦 Publish CLI
    needs: [publish-engine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Publish rigorix-cli (skip if exists)
        run: |
          VERSION=$(grep '^version' cli/Cargo.toml | head -1 | sed 's/version = "//;s/"//')
          if cargo search rigorix-cli 2>/dev/null | grep -q "^rigorix-cli = \"$VERSION\""; then
            echo "⏭️ rigorix-cli v$VERSION already published, skipping"
          else
            cargo publish -p rigorix-cli --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          fi

  publish-mcp:
    name: 📦 Publish MCP
    needs: [publish-engine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Publish rigorix-mcp (skip if exists)
        run: |
          VERSION=$(grep '^version' mcp/Cargo.toml | head -1 | sed 's/version = "//;s/"//')
          if cargo search rigorix-mcp 2>/dev/null | grep -q "^rigorix-mcp = \"$VERSION\""; then
            echo "⏭️ rigorix-mcp v$VERSION already published, skipping"
          else
            cargo publish -p rigorix-mcp --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          fi

  publish-actions:
    name: 📦 Publish actions
    needs: [publish-engine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Publish rigorix-actions (skip if exists)
        run: |
          VERSION=$(grep '^version' actions/Cargo.toml | head -1 | sed 's/version = "//;s/"//')
          if cargo search rigorix-actions 2>/dev/null | grep -q "^rigorix-actions = \"$VERSION\""; then
            echo "⏭️ rigorix-actions v$VERSION already published, skipping"
          else
            cargo publish -p rigorix-actions --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          fi

  # ── Create GitHub Release ─────────────────────────────────────
  github-release:
    name: 🏷️ GitHub Release
    needs: [publish-engine, publish-cli, publish-mcp, publish-actions]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate changelog
        shell: bash
        run: |
          echo "# Rigorix ${{ github.ref_name }}" > release-notes.md
          echo "" >> release-notes.md
          echo "See [CHANGELOG](.pi/architecture/CHANGELOG.md) for details." >> release-notes.md
          echo "" >> release-notes.md
          echo "## Crates Published" >> release-notes.md
          echo "- [rigorix-engine](https://crates.io/crates/rigorix-engine)" >> release-notes.md
          echo "- [rigorix-mcp](https://crates.io/crates/rigorix-mcp)" >> release-notes.md
          echo "- [rigorix-cli](https://crates.io/crates/rigorix-cli)" >> release-notes.md
          echo "- [rigorix-actions](https://crates.io/crates/rigorix-actions)" >> release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
