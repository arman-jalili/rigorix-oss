# ═════════════════════════════════════════════════════════════════════
# Build Action Docker Image — Push to ghcr.io
#
# Builds the rigorix-actions Docker image from the repo root (so the
# build context includes engine/, cli/, Cargo.lock — all needed by
# actions/Dockerfile). Pushes to ghcr.io so action.yml can reference a
# pre-built image instead of building from source on every run.
#
# Triggered by:
#   - Push to main/tags touching action/engine/cli/mcp/server or the workspace
#     manifests (build + PUSH to ghcr.io)
#   - Pull requests touching the same paths (build only — no push; this is the
#     check that would have caught the #892 "server workspace member not copied
#     into actions/Dockerfile" regression, which was invisible to PR CI)
#   - Manual workflow_dispatch
# ═════════════════════════════════════════════════════════════════════

name: Build Action Image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - 'actions/**'
      - 'engine/**'
      - 'cli/**'
      - 'mcp/**'
      - 'server/**'
      # #1452: the image build parses **every** workspace manifest, so a member it does not
      # copy can still fail it — `wasm/Cargo.toml` is copied and `wasm/examples` was not, and
      # nothing ran when the probe example landed because `wasm/**` was not in this list. A
      # workspace member changing is a reason to build the image.
      - 'wasm/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'actions/**'
      - 'engine/**'
      - 'cli/**'
      - 'mcp/**'
      - 'server/**'
      # #1452: the image build parses **every** workspace manifest, so a member it does not
      # copy can still fail it — `wasm/Cargo.toml` is copied and `wasm/examples` was not, and
      # nothing ran when the probe example landed because `wasm/**` was not in this list. A
      # workspace member changing is a reason to build the image.
      - 'wasm/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}/actions

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: actions/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
