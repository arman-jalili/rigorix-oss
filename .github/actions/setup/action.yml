# ─────────────────────────────────────────────────────────────────────
# Shared setup action — Rust toolchain, caching, workspace preparation
# Used by all workflows via `uses: ./.github/actions/setup`
# ─────────────────────────────────────────────────────────────────────

name: Setup Rust
description: Install Rust toolchain, configure cargo cache, prepare workspace

inputs:
  cache-key:
    description: "Ignored: kept so the 8 call sites do not need editing in the same change"
    required: false
    default: cargo

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      shell: bash
      run: |
        rustup set profile minimal
        rustup toolchain install stable --component rustfmt,clippy
        rustup default stable

    # One cache for the workspace, not fourteen (#1439).
    #
    # This used to be `actions/cache@v4` keyed by `${{ inputs.cache-key }}-<lockfile>`, and the
    # cache key is per job (`lint-<crate>`, `test-<crate>`, …): every job saved its own copy of
    # `target/` and none of them could restore another's. `Swatinem/rust-cache` knows what a
    # cargo workspace's `target/` looks like — incremental dirs, build script outputs, the
    # registry — and `shared-key` makes the key constant across jobs, so a warm cache from any
    # job serves all of them.
    #
    # `save-if` is the other half: only `main` writes. A PR restores the cache main warmed and
    # does not add fourteen more copies of a tree it did not finish building.
    - name: Restore the workspace cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: workspace-v1
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Install cargo tools
      shell: bash
      run: |
        cargo install cargo-audit --locked 2>/dev/null || true
        cargo install cargo-llvm-cov --locked 2>/dev/null || true
        rustup component add llvm-tools-preview 2>/dev/null || true

    - name: Install cargo-nextest (pinned)
      shell: bash
      # #1373: the test runner is pinned the way the toolchain is, and the pin is
      # VERIFIED — a version that floats is a test result that floats, and an
      # unverified pin is just a comment. Prebuilt binary, not `cargo install`:
      # compiling nextest would cost more than the tests it runs.
      env:
        NEXTEST_VERSION: "0.9.151"
      run: |
        if [ -x "$HOME/.cargo/bin/cargo-nextest" ] && \
           "$HOME/.cargo/bin/cargo-nextest" nextest --version 2>/dev/null | grep -q "$NEXTEST_VERSION"; then
          echo "cargo-nextest $NEXTEST_VERSION already installed"
        else
          curl -LsSf "https://get.nexte.st/${NEXTEST_VERSION}/linux" | tar zxf - -C "$HOME/.cargo/bin"
        fi
        installed="$(cargo nextest --version | head -1)"
        case "$installed" in
          *"$NEXTEST_VERSION"*) echo "✅ $installed" ;;
          *) echo "::error::cargo-nextest pin mismatch: wanted $NEXTEST_VERSION, got $installed"; exit 1 ;;
        esac

    - name: Verify workspace
      shell: bash
      run: cargo metadata --format-version 1 --no-deps > /dev/null
